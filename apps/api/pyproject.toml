[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "convertbox-api"
version = "0.1.0"
description = "ConvertBox file conversion API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "pillow-heif>=1,<2",
  "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "openpyxl>=3.1,<4", "python-pptx>=1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["convertbox_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
