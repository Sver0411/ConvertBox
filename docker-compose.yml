services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-1073741824}
      - JOB_TTL=${JOB_TTL:-3600}
      - TEMP_DIRECTORY=${TEMP_DIRECTORY:-/tmp/convertbox}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - MAX_VIDEO_CONCURRENCY=${MAX_VIDEO_CONCURRENCY:-1}
