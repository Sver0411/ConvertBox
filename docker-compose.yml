services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-1073741824}
      - JOB_TTL=${JOB_TTL:-3600}
      - TEMP_DIRECTORY=${TEMP_DIRECTORY:-/tmp/convertbox}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - MAX_VIDEO_CONCURRENCY=${MAX_VIDEO_CONCURRENCY:-1}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-4}
      - MAX_UPLOAD_WAITERS=${MAX_UPLOAD_WAITERS:-8}
      - UPLOAD_ACQUIRE_TIMEOUT=${UPLOAD_ACQUIRE_TIMEOUT:-5}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-2147483648}
      - MAX_TEMP_USAGE=${MAX_TEMP_USAGE:-10737418240}
      - MAX_OUTPUT_SIZE=${MAX_OUTPUT_SIZE:-536870912}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-200}
      - MAX_PDF_RENDER_PIXELS=${MAX_PDF_RENDER_PIXELS:-80000000}
      - MAX_PDF_OUTPUT_BYTES=${MAX_PDF_OUTPUT_BYTES:-536870912}
      - POST_JOBS_RATE_LIMIT=${POST_JOBS_RATE_LIMIT:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
