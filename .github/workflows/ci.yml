name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress fonts-liberation libcairo2
      - run: npm ci
      - run: uv sync --project apps/api --extra test
      - run: npm run generate-tool-docs -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:load
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress fonts-liberation libcairo2
      - run: python -m pip install -e './apps/api[test]'
      - run: cd apps/api && python -m pytest tests
